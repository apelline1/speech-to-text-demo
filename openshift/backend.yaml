# ── Speech-to-Text Backend ────────────────────────────────────────────────────
# FastAPI + faster-whisper (CPU, int8)
#
# Build the image inside OpenShift (no podman / Quay.io required):
#
#   Option A — build from GitHub:
#     oc new-build https://github.com/apelline1/speech-to-text-demo \
#       --context-dir=backend --name=speech-to-text-backend --strategy=docker
#
#   Option B — build from local directory:
#     oc new-build --binary --strategy=docker --name=speech-to-text-backend
#     oc start-build speech-to-text-backend --from-dir=./backend --follow
#
# The image is stored in the internal registry and referenced via ImageStream.
# ─────────────────────────────────────────────────────────────────────────────
---
# ImageStream — tracks the built image inside the internal registry
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: speech-to-text-backend
  labels:
    app: speech-to-text
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-to-text-backend
  labels:
    app: speech-to-text
    component: backend
  annotations:
    # Re-deploy automatically whenever a new image is built
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"speech-to-text-backend:latest"},
        "fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-to-text
      component: backend
  template:
    metadata:
      labels:
        app: speech-to-text
        component: backend
    spec:
      containers:
        - name: backend
          image: speech-to-text-backend:latest   # resolved from ImageStream
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WHISPER_MODEL_SIZE
              value: "small"        # change to "medium" if you have more RAM
            - name: COMPUTE_TYPE
              value: "int8"         # CPU-optimised quantisation
            - name: DEVICE
              value: "cpu"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "6Gi"         # increase to 10Gi for "medium" model
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45  # model takes ~30s to load on first start
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: speech-to-text-backend
  labels:
    app: speech-to-text
    component: backend
spec:
  selector:
    app: speech-to-text
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# Expose backend externally (optional — needed only for direct API testing)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: speech-to-text-backend
  labels:
    app: speech-to-text
    component: backend
spec:
  to:
    kind: Service
    name: speech-to-text-backend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
