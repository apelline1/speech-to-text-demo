# ── Speech-to-Text Frontend ───────────────────────────────────────────────────
# nginx-unprivileged serving index.html + proxying /api/ to backend Service.
#
# Before deploying, build and push the image:
#   podman build -t quay.io/YOUR_ORG/speech-to-text-frontend:latest ./frontend
#   podman push quay.io/YOUR_ORG/speech-to-text-frontend:latest
# Then replace the image field below.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-to-text-frontend
  labels:
    app: speech-to-text
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-to-text
      component: frontend
  template:
    metadata:
      labels:
        app: speech-to-text
        component: frontend
    spec:
      containers:
        - name: frontend
          image: quay.io/YOUR_ORG/speech-to-text-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: speech-to-text-frontend
  labels:
    app: speech-to-text
    component: frontend
spec:
  selector:
    app: speech-to-text
    component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Public-facing Route — this is the URL you share for the demo
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: speech-to-text
  labels:
    app: speech-to-text
    component: frontend
spec:
  to:
    kind: Service
    name: speech-to-text-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
