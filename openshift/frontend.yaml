# ── Speech-to-Text Frontend ───────────────────────────────────────────────────
# nginx-unprivileged serving index.html + proxying /api/ to backend Service.
#
# Build the image inside OpenShift (no podman / Quay.io required):
#
#   Option A — build from GitHub:
#     oc new-build https://github.com/YOUR_GITHUB_USERNAME/speech-to-text-demo \
#       --context-dir=frontend --name=speech-to-text-frontend --strategy=docker
#
#   Option B — build from local directory:
#     oc new-build --binary --strategy=docker --name=speech-to-text-frontend
#     oc start-build speech-to-text-frontend --from-dir=./frontend --follow
#
# The image is stored in the internal registry and referenced via ImageStream.
# ─────────────────────────────────────────────────────────────────────────────
---
# ImageStream — tracks the built image inside the internal registry
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: speech-to-text-frontend
  labels:
    app: speech-to-text
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-to-text-frontend
  labels:
    app: speech-to-text
    component: frontend
  annotations:
    # Re-deploy automatically whenever a new image is built
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"speech-to-text-frontend:latest"},
        "fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-to-text
      component: frontend
  template:
    metadata:
      labels:
        app: speech-to-text
        component: frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/YOUR_NAMESPACE/speech-to-text-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: speech-to-text-frontend
  labels:
    app: speech-to-text
    component: frontend
spec:
  selector:
    app: speech-to-text
    component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Public-facing Route — this is the URL you share for the demo
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: speech-to-text
  labels:
    app: speech-to-text
    component: frontend
spec:
  to:
    kind: Service
    name: speech-to-text-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
